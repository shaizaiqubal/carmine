name: Embedding benchmark
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-bge-small-en-v1-5-5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install -r requirements-pipeline.txt
      - run: python scripts/embedding_benchmark.py --batch-size 32 --max-seq-length 128 --threads 2
