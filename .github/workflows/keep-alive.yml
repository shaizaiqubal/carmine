name: Keep services alive
on:
  schedule: [{cron: '17 3 * * *'}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Render
        run: curl --fail --retry 3 "$API_HEALTH_URL"
        env: {API_HEALTH_URL: '${{ vars.API_HEALTH_URL }}'}
      - name: Generate Supabase activity
        run: curl --fail --retry 3 -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/health"
        env:
          SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'
          SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}'
